name: Integración Continua (CI)

on:
  push:
    branches: [ "**" ] # Se ejecuta en cualquier rama

jobs:
  test:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema para PySide6 y Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-cursor0 libegl1 libgl1

      - name: Instalar uv y caché
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Instalar dependencias bloqueadas (falla si uv.lock no está actualizado)
        run: uv sync --locked

      - name: Ejecutar pruebas
        run: xvfb-run -a uv run pytest -v